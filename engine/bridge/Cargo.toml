[package]
name = "tandem-rust-workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `inspect`: the test suite reads raw objects through this package; the desktop app links the engine without it.
tandem-pdf-engine = { path = "..", features = ["inspect"] }
wasm-bindgen = "=0.2.129"
serde_json = "=1.0.151"
