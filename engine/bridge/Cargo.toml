[package]
name = "tandem-rust-workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tandem-pdf-engine = { path = ".." }
wasm-bindgen = "=0.2.129"
serde_json = "=1.0.151"

# The engine's patched hayro crates (../vendor/*/PATCH.md).
[patch.crates-io]
hayro = { path = "../vendor/hayro-0.8.0" }
hayro-interpret = { path = "../vendor/hayro-interpret-0.8.0" }
hayro-syntax = { path = "../vendor/hayro-syntax-0.8.0" }
