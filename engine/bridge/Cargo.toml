[package]
name = "tandem-rust-workflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tandem-pdf-engine = { path = ".." }
wasm-bindgen = "=0.2.129"
serde_json = "=1.0.151"

# Newer-idiom lints that rust-version 1.92 (for hayro) switched on, as in the core crate.
[lints.clippy]
collapsible_if = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
