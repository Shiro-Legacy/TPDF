[package]
name = "tandem-pdf-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "AGPL-3.0-or-later"
description = "Experimental safe Rust PDF engine for Tandem PDF"
publish = false

[lib]
name = "tandem_pdf_engine"
path = "src/lib.rs"

[[bin]]
name = "pdf-inspect"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[features]
default = []
raster = ["dep:tiny-skia"]

[dependencies]
aes = "=0.8.4"
md-5 = "=0.10.6"
miniz_oxide = "=0.8.9"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
tiny-skia = { version = "=0.12.0", optional = true, default-features = false, features = ["std"] }
