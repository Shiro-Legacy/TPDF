[package]
name = "tandem-pdf-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
description = "Experimental safe Rust PDF engine for Tandem PDF"
publish = false

[lib]
name = "tandem_pdf_engine"
path = "src/lib.rs"

[[bin]]
name = "pdf-inspect"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Newer-idiom lints that rust-version 1.92 (for hayro) switched on; the existing
# code predates let chains, is_multiple_of and as_chunks.
collapsible_if = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"

[features]
default = []
raster = ["dep:tiny-skia"]

[dependencies]
aes = "=0.8.4"
hayro = "=0.8.0"
hayro-interpret = "=0.8.0"
hayro-syntax = "=0.8.0"
md-5 = "=0.10.6"
miniz_oxide = "=0.8.9"
sha2 = "=0.10.9"
tiny-skia = { version = "=0.12.0", optional = true, default-features = false, features = ["std"] }
