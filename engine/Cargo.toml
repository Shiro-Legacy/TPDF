[package]
name = "tandem-pdf-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Experimental safe Rust PDF engine for Tandem PDF"
publish = false

[lib]
name = "tandem_pdf_engine"
path = "src/lib.rs"

[[bin]]
name = "pdf-inspect"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
# Temporary, with the three allows below: chunks_exact_to_as_chunks is unknown
# to the 1.92 toolchain's Clippy.
unknown_lints = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Temporary: newer-idiom lints that rust-version 1.92 (for hayro) switched on.
# Code written for 1.85.1 (this tree and the parallel worktrees) predates let
# chains, is_multiple_of and as_chunks; one pass after those merge fixes the
# sites and removes these allows.
collapsible_if = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"

[dependencies]
aes = "=0.8.4"
hayro = "=0.8.0"
hayro-interpret = "=0.8.0"
hayro-syntax = "=0.8.0"
md-5 = "=0.10.6"
miniz_oxide = "=0.8.9"
png = "=0.18.1"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
# Bidi_Class for text extraction (spec 05 4.4, owner decision T6).
unicode-bidi = "=0.3.18"

# Patched copies of hayro's renderer and interpreter: panics and unbounded
# work on hostile files (vendor/*/PATCH.md, DEPENDENCIES.md).
[patch.crates-io]
hayro = { path = "vendor/hayro-0.8.0" }
hayro-interpret = { path = "vendor/hayro-interpret-0.8.0" }
hayro-syntax = { path = "vendor/hayro-syntax-0.8.0" }
