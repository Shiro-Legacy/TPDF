[package]
name = "tandem-pdf-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Experimental safe Rust PDF engine for Tandem PDF"
publish = false
# A member of the repository's one workspace (../crates/Cargo.toml: lockfile,
# target directory, profiles and the [patch.crates-io] for vendor/).
workspace = "../crates"

[lib]
name = "tandem_pdf_engine"
path = "src/lib.rs"

[[bin]]
name = "pdf-inspect"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
# Temporary, with the three allows below: chunks_exact_to_as_chunks is unknown
# to the 1.92 toolchain's Clippy.
unknown_lints = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Temporary: newer-idiom lints that rust-version 1.92 (for hayro) switched on.
# Code written for 1.85.1 (this tree and the parallel worktrees) predates let
# chains, is_multiple_of and as_chunks; one pass after those merge fixes the
# sites and removes these allows.
collapsible_if = "allow"
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
# Temporary (October 21, 2026, when the engine joined the workspace and
# `cargo clippy --workspace` started linting it next to tandem-app): built with
# tandem-app, whose serde_json `preserve_order` feature makes app::AppError's
# `extra` Map an IndexMap, AppError is 144 bytes (96 built alone), over
# clippy's 128-byte threshold in some 340 `Result<_, AppError>` signatures.
# The fix is boxing `extra` or AppError itself; until then the lint is off.
result_large_err = "allow"

[dependencies]
aes = "=0.8.4"
hayro = "=0.8.0"
hayro-interpret = "=0.8.0"
hayro-syntax = "=0.8.0"
md-5 = "=0.10.6"
miniz_oxide = "=0.8.9"
png = "=0.18.1"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
# Bidi_Class for text extraction (spec 05 4.4, owner decision T6).
unicode-bidi = "=0.3.18"

# hayro, hayro-interpret and hayro-syntax resolve to the patched copies in
# vendor/ (panics and unbounded work on hostile files; vendor/*/PATCH.md,
# DEPENDENCIES.md) through ../crates/Cargo.toml's [patch.crates-io].
