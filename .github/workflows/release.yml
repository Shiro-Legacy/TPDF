# Builds the Rust desktop app (crates/: Tauri 2 shell tandem-desktop, Leptos UI tandem-ui compiled to WASM) on
# macOS, Windows and Linux, checks it on each, packages it, and on a tag v<version> drafts a GitHub Release with
# every installer and a SHA256SUMS file. Publishing the draft is a manual step. "Run workflow" (workflow_dispatch)
# and a pull request that touches the build or packaging do everything except the release; the installers are
# then downloadable from the run's artifacts.
#
# Per runner: the UI to WASM; cargo fmt (once, on Linux); clippy -D warnings on Rust 1.98.1 and 1.92 (the
# workspace's rust-version), so each OS's own shell code (macos.rs, win.rs, linux.rs) is linted on both; the crate
# tests; the package (scripts/package-mac.sh, package-windows.ps1, package-linux.sh; they build the release binary
# the installers carry); the app test suite against that binary (TANDEM_APP_BIN); the installed package's
# self-test (--smoke).
#
# Runners are pinned images, so an image change never alters a release unnoticed: macos-15 (arm64), windows-2025
# (x64) and ubuntu-22.04 (x64). Linux builds on 22.04 because a binary needs the builder's glibc version or newer:
# built there, the .deb and the AppImage run on 22.04, 24.04 and 26.04 (README's supported releases; linux-check
# installs them on the two newer ones). 22.04 also has WebKitGTK 4.1 (libwebkit2gtk-4.1-dev), which Tauri 2 needs.
#
# Toolchain pins: Rust 1.98.1 builds, Rust 1.92 must still compile (clippy), both with wasm32-unknown-unknown;
# wasm-bindgen-cli 0.2.129 matches the wasm-bindgen crate in crates/Cargo.lock and engine/bridge; tauri-cli 2.12.3
# is the CLI the Mac package is built with (for tauri 2.11.5 / tauri-bundler 2.10.3).
#
# The engine job still builds the engine's WASM package (engine/web/pkg): the app suite's engine-adapter tests load
# it through the test build of web/ (npm run build:test, build-test/), and the MuPDF test oracle (build-oracle/)
# rereads their output. The desktop app links the engine natively and ships no WASM.
#
# Private test keys (fixtures/p5/*.p12, fixtures/p0b/.ca/*.key, ...) never go through GitHub, so here the test
# files and the two crate tests that sign with them are left out, by name, with a warning. Run the gates (with the
# keys) on a seat before tagging.
#
# Signing is on only when its repository secrets exist; without them the installers are unsigned:
#   macOS: MAC_CERT_P12 (base64 of the "Developer ID Application" certificate exported as .p12), MAC_CERT_PASSWORD,
#     APPLE_SIGN_IDENTITY ("Developer ID Application: <name> (<team id>)"), and for notarization APPLE_ID,
#     APPLE_APP_PASSWORD (an app-specific password), APPLE_TEAM_ID.
#   Windows: WIN_CERT_PFX (base64 of a code-signing certificate as .pfx), WIN_CERT_PASSWORD; optional
#     WIN_TIMESTAMP_URL (default http://timestamp.digicert.com). scripts/package-windows.ps1 signs through Tauri.
#   Linux: none (the .deb and the AppImage are not signed).
name: release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/Cargo.toml
      - crates/Cargo.lock
      - crates/*/Cargo.toml
      - crates/tandem-sign/Cargo.lock
      - crates/tandem-desktop/build.rs
      - crates/tandem-desktop/tauri*.conf.json
      - crates/tandem-desktop/icons/**
      - crates/tandem-desktop/linux/**
      - crates/tandem-ui/build.sh
      - scripts/package-mac.sh
      - scripts/package-windows.ps1
      - scripts/package-linux.sh
      - scripts/crate-licenses.py
      - scripts/licenses-standard/**
      - engine/tools/build-workflow.sh
      - engine/tools/rustc-stable-metadata.sh
      - engine/tools/workflow-sources.sh
      - engine/reference/wasm-release.sha256
      - engine/Cargo.toml
      - engine/bridge/Cargo.toml
      - engine/bridge/Cargo.lock
      - web/**
      - scripts/build-test.mjs
      - scripts/engine-package.mjs
      - package.json
      - package-lock.json
  workflow_dispatch:

# Read-only by default; only the release job, which drafts the GitHub Release, may write.
permissions:
  contents: read

env:
  RUST_STABLE: 1.98.1
  RUST_MSRV: '1.92'
  WASM_BINDGEN: 0.2.129
  TAURI_CLI_VERSION: 2.12.3
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # The engine's WASM package, for the app suite's engine-adapter tests (through build-test/), built once.
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git while third-party crates' build scripts run.
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-engine-${{ runner.os }}-${{ hashFiles('engine/bridge/Cargo.lock') }}
          restore-keys: cargo-engine-${{ runner.os }}-
      - name: Rust toolchains and the WASM target
        run: |
          rustup toolchain install "$RUST_STABLE" "$RUST_MSRV" --profile minimal --target wasm32-unknown-unknown
          rustc "+$RUST_STABLE" --version
          rustc "+$RUST_MSRV" --version
      - name: wasm-bindgen-cli
        run: |
          cargo "+$RUST_STABLE" install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked --root "$RUNNER_TEMP/wasm-tools"
          "$RUNNER_TEMP/wasm-tools/bin/wasm-bindgen" --version
      - name: The minimum toolchain still compiles the WASM library
        run: cargo "+$RUST_MSRV" check --manifest-path engine/bridge/Cargo.toml --locked --release --target wasm32-unknown-unknown --lib
      # build-workflow.sh remaps the build-machine paths and gives the path dependencies a path-independent crate hash
      # (tools/rustc-stable-metadata.sh), for the wasm32 build only; --wasm-only skips the native CLI.
      - name: Build the WASM package (engine/web/pkg)
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_STABLE }}
        run: |
          WASM_BINDGEN_BIN="$RUNNER_TEMP/wasm-tools/bin/wasm-bindgen" sh engine/tools/build-workflow.sh --wasm-only
          ls -l engine/web/pkg
          wasm=engine/web/pkg/tandem_rust_workflow_bg.wasm
          if grep -a -c -F -e "$HOME" -e "$GITHUB_WORKSPACE" -e /home/ -e /Users/ "$wasm"; then
            echo "::error::The WASM names a build-machine path; build-workflow.sh's remapping did not apply."
            exit 1
          fi
      # The committed record (sha256sum format, written from a local build of the same sources): the same sources
      # must give the same WASM and glue. A record for other sources is stale, not wrong: the job says so and goes on.
      - name: The WASM matches the committed record for these sources
        run: |
          cd engine/web/pkg
          record=../../reference/wasm-release.sha256
          if grep ' sources.sha256$' "$record" | sha256sum --check --strict --quiet -; then
            sha256sum --check --strict "$record"
          else
            echo "::warning::engine/reference/wasm-release.sha256 records other sources than this commit's; the WASM ($(sha256sum tandem_rust_workflow_bg.wasm | cut -d' ' -f1)) was not compared. Record it from a local build (docs/building-rust-release.md)."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: engine-pkg
          if-no-files-found: error
          path: engine/web/pkg

  build:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            bin: crates/target/release/tandem-pdf
          - os: windows-2025
            bin: crates/target/release/tandem-pdf.exe
          - os: ubuntu-22.04
            bin: crates/target/release/tandem-pdf
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      SIGN_MAC: ${{ secrets.MAC_CERT_P12 != '' }}
      SIGN_WIN: ${{ secrets.WIN_CERT_PFX != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The tag is the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python3 -c "import json;print(json.load(open('crates/tandem-desktop/tauri.conf.json'))['version'])" 2>/dev/null \
            || python -c "import json;print(json.load(open('crates/tandem-desktop/tauri.conf.json'))['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "::error::tauri.conf.json has $v, the tag is $GITHUB_REF_NAME"; exit 1; }
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          grep -q "^version = \"$v\"" crates/Cargo.toml

      - name: Linux packages for Tauri (WebKitGTK 4.1, GTK 3), xvfb and poppler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential pkg-config file patchelf libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev \
            xvfb xauth poppler-utils

      # Every later cargo call uses the build toolchain unless it names another (+1.92).
      - name: Rust toolchains, the WASM target, clippy and rustfmt
        run: |
          rustup toolchain install "$RUST_STABLE" "$RUST_MSRV" --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          echo "RUSTUP_TOOLCHAIN=$RUST_STABLE" >> "$GITHUB_ENV"
          rustc "+$RUST_STABLE" --version
          rustc "+$RUST_MSRV" --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/tandem-sign/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      # wasm-bindgen-cli and tauri-cli, built once per runner image and version.
      - uses: actions/cache@v4
        id: tools
        with:
          path: ~/.tpdf-tools
          key: tools-${{ matrix.os }}-rust${{ env.RUST_STABLE }}-wbg${{ env.WASM_BINDGEN }}-tauri${{ env.TAURI_CLI_VERSION }}
      - name: wasm-bindgen-cli and tauri-cli
        env:
          CACHED: ${{ steps.tools.outputs.cache-hit }}
        run: |
          # A path every shell on the runner reads (on Windows C:/Users/..., not Git Bash's /c/Users/...).
          tools="$(cd ~ && (pwd -W 2>/dev/null || pwd))/.tpdf-tools"
          if [ "$CACHED" != true ]; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked --root "$tools"
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked --root "$tools"
          fi
          exe=; [ "$RUNNER_OS" = Windows ] && exe=.exe
          echo "WASM_BINDGEN_BIN=$tools/bin/wasm-bindgen$exe" >> "$GITHUB_ENV"
          echo "TAURI_CLI=$tools/bin/cargo-tauri$exe" >> "$GITHUB_ENV"
          "$tools/bin/wasm-bindgen$exe" --version
          "$tools/bin/cargo-tauri$exe" --version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Part of the app suite loads the engine adapter from build-test/ (web/ compiled) and the MuPDF oracle from
      # build-oracle/; the rest drives TANDEM_APP_BIN. npm ci brings typescript, mupdf and @types/node only.
      - name: The suite's Node side (npm ci)
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: engine-pkg
          path: engine/web/pkg
      - name: build-test/ and build-oracle/
        run: npm run build:test && npm run build:oracle
      # The independent PDF checks some tests run (README "Python QA helpers"); those tests skip without it.
      - name: Python QA venv (pypdf, pyHanko)
        run: |
          python3 -m venv .venv-qa 2>/dev/null || python -m venv .venv-qa
          if [ "$RUNNER_OS" = Windows ]; then pip=.venv-qa/Scripts/pip; else pip=.venv-qa/bin/pip; fi
          "$pip" install -q pypdf==6.18.1 pyHanko==0.37.0

      - name: The UI (WASM, release)
        run: sh crates/tandem-ui/build.sh --release

      - name: cargo fmt
        if: runner.os == 'Linux'
        run: |
          (cd crates && cargo fmt --all -- --check)
          (cd crates/tandem-sign && cargo fmt --all -- --check)

      - name: clippy (Rust ${{ env.RUST_STABLE }})
        run: |
          cd crates
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy -p tandem-ui --target wasm32-unknown-unknown --locked -- -D warnings
          (cd tandem-sign && cargo clippy --all-targets --all-features --locked -- -D warnings)

      - name: clippy (Rust ${{ env.RUST_MSRV }})
        run: |
          cd crates
          cargo "+$RUST_MSRV" clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo "+$RUST_MSRV" clippy -p tandem-ui --target wasm32-unknown-unknown --locked -- -D warnings
          (cd tandem-sign && cargo "+$RUST_MSRV" clippy --all-targets --all-features --locked -- -D warnings)

      - name: Crate tests
        run: |
          skip=()
          if [ ! -f fixtures/p5/leaf.p12 ] || [ ! -f fixtures/p0b/.ca/ca.pem ]; then
            echo "::warning::No private test keys here: trust_list_through_the_host and certificates_sign_once are left out (tandem-sign's key tests skip themselves)."
            skip=(--skip trust_list_through_the_host --skip certificates_sign_once)
          fi
          run=(); [ "$RUNNER_OS" = Linux ] && run=(xvfb-run -a)
          cd crates
          "${run[@]}" cargo test --workspace --all-features --locked -- "${skip[@]}"
          (cd tandem-sign && cargo test --release --all-features --locked)

      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.SIGN_MAC == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri's own variable names, set only when there is a value (an empty APPLE_ID would start notarization).
          if [ "$SIGN_MAC" = true ] && [ -n "$SIGN_IDENTITY" ]; then
            export APPLE_SIGNING_IDENTITY="$SIGN_IDENTITY"
            if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
              export APPLE_ID="$NOTARY_ID" APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM"
            fi
          else
            echo "::warning::No signing secrets: this macOS build is signed ad hoc and not notarized."
          fi
          zsh scripts/package-mac.sh
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            spctl --assess --type execute -vv "crates/target/release/bundle/macos/Tandem PDF.app"
          fi

      - name: Import the Windows code-signing certificate
        if: runner.os == 'Windows' && env.SIGN_WIN == 'true'
        shell: pwsh
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
          WIN_TIMESTAMP_URL: ${{ secrets.WIN_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX))
          $password = ConvertTo-SecureString $env:WIN_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "TANDEM_WIN_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ($env:WIN_TIMESTAMP_URL) { "TANDEM_WIN_TIMESTAMP_URL=$env:WIN_TIMESTAMP_URL" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:SIGN_WIN -ne 'true') { Write-Output '::warning::No signing secrets: this Windows installer is unsigned (SmartScreen will warn).' }
          ./scripts/package-windows.ps1

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh

      # The suite drives the binary the installers carry (cargo tauri build wrote it to crates/target/release).
      - name: App test suite (TANDEM_APP_BIN)
        run: |
          files=(tests/*.test.mjs)
          if [ ! -f fixtures/p5/leaf.p12 ] || [ ! -f fixtures/p0b/.ca/ca.pem ]; then
            keyed=$(grep -l -E "leaf(-ec|-legacy|-enc)?\.(p12|pem)|\.ca/[a-z-]+\.(key|pem)|false-ca/[a-z0-9]+\.key" tests/*.test.mjs || true)
            echo "::warning::No private test keys here; left out: $(echo $keyed)"
            files=($(printf '%s\n' "${files[@]}" | grep -v -x -F -f <(printf '%s\n' $keyed)))
          fi
          export TANDEM_APP_BIN="$GITHUB_WORKSPACE/${{ matrix.bin }}"
          run=(); [ "$RUNNER_OS" = Linux ] && run=(xvfb-run -a)
          "${run[@]}" node --test --test-concurrency=2 "${files[@]}" > "$RUNNER_TEMP/app-suite.log" 2>&1 && s=0 || s=$?
          grep -E '^ *not ok' "$RUNNER_TEMP/app-suite.log" || true
          tail -12 "$RUNNER_TEMP/app-suite.log"
          exit $s
      - name: Keep the app suite's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-suite-${{ runner.os }}
          path: ${{ runner.temp }}/app-suite.log
          if-no-files-found: ignore

      # What a person gets: the package installed the way the docs say, then the installed app's self-test.
      - name: Installed self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          app="crates/target/release/bundle/macos/Tandem PDF.app"
          for f in licenses/THIRD-PARTY.txt licenses/LICENSE-Tandem-PDF.txt fixtures/hello.pdf fonts/DroidSansFallback.ttf; do
            test -f "$app/Contents/Resources/$f" || { echo "::error::The app has no Resources/$f"; exit 1; }
          done
          "$app/Contents/MacOS/tandem-pdf" --smoke --report="$RUNNER_TEMP/smoke.json"
      - name: Installed self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'crates\target\release\bundle\nsis\*-setup.exe' | Select-Object -First 1
          # A silent per-user install, to where the docs say the app goes.
          $p = Start-Process -Wait -PassThru $setup.FullName -ArgumentList '/S'
          if ($p.ExitCode) { exit $p.ExitCode }
          $dir = Join-Path $env:LOCALAPPDATA 'Tandem PDF'
          foreach ($f in 'tandem-pdf.exe', 'uninstall.exe', 'licenses\THIRD-PARTY.txt', 'licenses\LICENSE-Tandem-PDF.txt', 'fixtures\hello.pdf', 'fonts\DroidSansFallback.ttf') {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Output "::error::The install has no $f"; exit 1 }
          }
          $open = (Get-ItemProperty -ErrorAction SilentlyContinue 'HKCU:\Software\Classes\TandemPDF.pdf\shell\open\command').'(default)'
          if (-not $open) { Write-Output '::error::The installer did not register the PDF type'; exit 1 }
          Write-Output "PDF open command: $open"
          $app = Start-Process -Wait -PassThru (Join-Path $dir 'tandem-pdf.exe') -ArgumentList '--smoke', "--report=$env:RUNNER_TEMP\smoke.json"
          if ($app.ExitCode) { exit $app.ExitCode }
      - name: Installed self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q ./crates/target/release/bundle/deb/*.deb
          test -x /usr/bin/tandem-pdf
          ls "/usr/lib/Tandem PDF/licenses/THIRD-PARTY.txt" "/usr/lib/Tandem PDF/fixtures/hello.pdf" "/usr/lib/Tandem PDF/fonts/DroidSansFallback.ttf"
          xvfb-run -a /usr/bin/tandem-pdf --smoke --report="$RUNNER_TEMP/smoke.json"
          img=$(ls crates/target/release/bundle/appimage/*.AppImage)
          chmod +x "$img"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$img" --smoke --report="$RUNNER_TEMP/smoke-appimage.json"
          node -e "const r=require(process.argv[1]); console.log('AppImage', r.platform, r.arch, 'ok', r.ok); if (!r.ok) process.exit(1)" "$RUNNER_TEMP/smoke-appimage.json"
      - name: The self-test's report
        run: node -e "const r=require(process.argv[1]); console.log(r.platform, r.arch, 'ok', r.ok, 'packaged', r.packaged, 'engine', r.versions && r.versions.engine); if (!r.ok) process.exit(1)" "$RUNNER_TEMP/smoke.json"

      # Release names without spaces (GitHub would turn them into dots), as the Electron installers were named.
      - name: Collect the installers
        run: |
          v=$(node -p "require('./crates/tandem-desktop/tauri.conf.json').version")
          b=crates/target/release/bundle
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS) cp "$b"/dmg/*.dmg "dist/Tandem-PDF-$v-macos-arm64.dmg" ;;
            Windows) cp "$b"/nsis/*-setup.exe "dist/Tandem-PDF-$v-windows-x64-setup.exe" ;;
            Linux)
              cp "$b"/deb/*.deb "dist/tandem-pdf_${v}_amd64.deb"
              cp "$b"/appimage/*.AppImage "dist/Tandem-PDF-$v-linux-x86_64.AppImage" ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: dist/*

  # README's support statement: the .deb (built on 22.04 and self-tested there by the build job) installs and
  # passes its self-test on the newer supported Ubuntu releases; the AppImage too.
  linux-check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers-Linux
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xauth ./tandem-pdf_*_amd64.deb
          xvfb-run -a /usr/bin/tandem-pdf --smoke --report="$RUNNER_TEMP/smoke.json"
          chmod +x Tandem-PDF-*-linux-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a ./Tandem-PDF-*-linux-x86_64.AppImage --smoke --report="$RUNNER_TEMP/smoke-appimage.json"
          for r in smoke smoke-appimage; do
            node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); console.log(process.argv[1], r.platform, r.arch, 'ok', r.ok); if (!r.ok) process.exit(1)" "$RUNNER_TEMP/$r.json"
          done

  release:
    needs: [build, linux-check]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # The installers only: engine-pkg and the suite logs are not release assets.
          pattern: installers-*
          merge-multiple: true
      # No MuPDF source archive: no MuPDF ships, and the app and its engine are MIT; the source is this tag.
      # The AppImage carries its system libraries' licence texts (licenses/system-libraries inside it).
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          echo "Built by .github/workflows/release.yml from this tag with Rust $RUST_STABLE. SHA256SUMS lists each file's checksum." > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "Tandem PDF ${GITHUB_REF_NAME#v}"
