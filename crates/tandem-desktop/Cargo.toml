[package]
name = "tandem-desktop"
description = "Tandem PDF for macOS: the Tauri 2 shell around tandem-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
# The one native call (printing through AppKit, src/macos.rs) needs unsafe;
# everything else forbids it module by module.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "tandem-pdf"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tandem-protocol = { path = "../tandem-protocol" }
tandem-app = { path = "../tandem-app" }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# The one native module (src/macos.rs): printing through PDFKit's print
# panel, and web-view snapshots for screenshot runs. Already in Tauri's tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-web-kit = "=0.3.2"
objc2-pdf-kit = "=0.3.2"
block2 = "=0.6.2"
