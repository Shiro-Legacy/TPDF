[package]
name = "tandem-desktop"
description = "Tandem PDF for macOS, Windows and Linux: the Tauri 2 shell around tandem-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
# The per-OS native modules (src/macos.rs, src/win.rs) need unsafe;
# everything else forbids it.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "tandem-pdf"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tandem-protocol = { path = "../tandem-protocol" }
tandem-app = { path = "../tandem-app" }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# The one native module (src/macos.rs): printing through PDFKit's print
# panel, and web-view snapshots for screenshot runs. Already in Tauri's tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-web-kit = "=0.3.2"
objc2-pdf-kit = "=0.3.2"
block2 = "=0.6.2"

# Windows (src/win.rs): Task Dialog questions, the Print dialog and GDI printing, the
# clipboard, WebView2 snapshots and menu keys. All already in Tauri's tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
] }
webview2-com = "=0.38.2"

# Linux (src/linux.rs): GTK questions and printing, the clipboard, WebKitGTK snapshots.
# All already in Tauri's tree.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"
cairo-rs = { version = "=0.18.5", features = ["png"] }
