# One workspace for the whole Rust tree (docs/rust-and-ux-plan.md §1.3): the
# engine, its WASM bridge, tandem-sign and the four app crates share this
# lockfile, the target directory, the lints and the profiles below. engine/
# and engine/bridge/ point back here with `package.workspace`.
[workspace]
resolver = "3"
members = [
    "../engine",
    "../engine/bridge",
    "tandem-protocol",
    "tandem-app",
    "tandem-ui",
    "tandem-desktop",
    "tandem-sign",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The engine's patched hayro crates (../engine/vendor/*/PATCH.md).
[patch.crates-io]
hayro = { path = "../engine/vendor/hayro-0.8.0" }
hayro-interpret = { path = "../engine/vendor/hayro-interpret-0.8.0" }
hayro-syntax = { path = "../engine/vendor/hayro-syntax-0.8.0" }

# Debug builds keep line tables only (less memory on an 8 GB machine) and
# optimise the engine, which is unusably slow unoptimised.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.tandem-pdf-engine]
opt-level = 2

[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = false

# Shipping build: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 4
strip = true
