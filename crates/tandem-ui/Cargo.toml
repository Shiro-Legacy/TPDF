[package]
name = "tandem-ui"
description = "Tandem PDF user interface (Leptos, compiled to WASM, shown in the system web view)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tandem-protocol = { path = "../tandem-protocol" }
leptos = { version = "=0.8.22", features = ["csr"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Window", "Document", "Element", "HtmlElement", "KeyboardEvent", "PointerEvent", "WheelEvent", "DomRect", "MediaQueryList", "HtmlInputElement", "ResizeObserver", "ResizeObserverEntry", "IntersectionObserver", "IntersectionObserverEntry", "ScrollIntoViewOptions", "ScrollLogicalPosition", "HtmlButtonElement", "Node", "NodeList", "DragEvent", "MouseEvent", "Response", "Headers", "Performance", "CssStyleDeclaration", "Location"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-wasm-bindgen = "0.6"
