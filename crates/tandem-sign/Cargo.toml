[package]
name = "tandem-sign"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Digital signing and signature verification for Tandem PDF (PKCS#12, CMS, X.509)"
publish = false

[lints]
workspace = true

[dependencies]
aes = "=0.8.4"
base64ct = { version = "=1.8.3", features = ["alloc"] }
cbc = { version = "=0.1.2", features = ["alloc"] }
const-oid = { version = "=0.9.6", features = ["db"] }
der = { version = "=0.7.10", features = ["alloc", "oid"] }
des = "=0.8.1"
hmac = "=0.12.1"
md-5 = "=0.10.6"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pkcs8"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa", "pkcs8"] }
p521 = { version = "=0.13.3", default-features = false, features = ["ecdsa", "pkcs8"] }
pkcs1 = "=0.7.5"
pkcs12 = { version = "=0.1.0", features = ["kdf"] }
pkcs5 = { version = "=0.7.1", features = ["pbes2", "3des", "sha1-insecure"] }
pkcs8 = { version = "=0.10.2", features = ["alloc"] }
rand_core = "=0.6.4"
rc2 = "=0.8.1"
rsa = { version = "=0.9.10", default-features = false }
sec1 = { version = "=0.7.3", default-features = false, features = ["der", "pkcs8"] }
serde_json = "=1.0.151"
sha1 = { version = "=0.10.6", features = ["oid"] }
sha2 = { version = "=0.10.9", features = ["oid"] }
signature = "=2.2.0"
spki = { version = "=0.7.3", features = ["alloc"] }
zeroize = { version = "=1.9.0", features = ["zeroize_derive"] }
